name: Deploy to Cloudflare Pages

on:
  schedule:
    # Run every 24 hours at 01:00 UTC
    - cron: '0 1 * * *'
  push:
    branches: [main]
  workflow_dispatch:

# Don't deploy two runs in parallel — Cloudflare Pages will accept them
# but we want the most recent main commit to be the live one.
concurrency:
  group: cf-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      # Use the public domain for absolute sitemap URLs.
      FFWIKI_BASE_URL: ${{ vars.FFWIKI_BASE_URL || 'https://fusionfall.wiki' }}
      # Authenticated GitHub API requests get a 15K/hr rate limit instead of 60/hr.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Service-account JSON used to read the player-maintained item price guide.
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      FFWIKI_OBJECTS_URL: ${{ vars.FFWIKI_OBJECTS_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace deps
        run: npm ci

      # Always target the latest FFInfoPacks release. Resolving the tag up
      # front lets the cache key rev when upstream ships a new release.
      - name: Resolve latest FFInfoPacks tag
        id: ffinfo
        run: |
          TAG=$(curl -sSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/FinnHornhoover/FFInfoPacks/releases/latest \
            | jq -r '.tag_name')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::Failed to resolve latest FFInfoPacks release tag"
            exit 1
          fi
          echo "FFInfoPacks latest: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Cache the 1.6 GB of FFInfoPacks ZIPs so cold-cache runs are the
      # exception, not the rule. Cache key changes when upstream releases.
      - name: Cache FFInfoPacks ZIPs
        uses: actions/cache@v4
        with:
          path: .cache/ffinfo
          key: ffinfo-${{ steps.ffinfo.outputs.tag }}-v1

      # Per-build icon dedup output — invalidates with the ZIPs above.
      - name: Cache icon dedup maps
        uses: actions/cache@v4
        with:
          path: .cache/iconmaps
          key: iconmaps-${{ steps.ffinfo.outputs.tag }}-v1

      - name: Resolve 3D cache inputs
        id: objects-inputs
        if: env.FFWIKI_OBJECTS_URL != ''
        env:
          FFINFO_TAG: ${{ steps.ffinfo.outputs.tag }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        shell: bash
        run: |
          tag=$(jq -nr --arg tag "$FFINFO_TAG" '$tag | @uri')
          release=$(curl -fsSL --retry 2 -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/FinnHornhoover/FFObjectPacks/releases/tags/$tag")
          packs=$(jq -ceS '[.assets[] | select(.name | test("\\.zip$"; "i")) |
            {id, name, size, digest, updated_at}] | sort_by(.name) | select(length > 0)' <<< "$release")
          key=$(printf '%s\0' "$FFINFO_TAG" "$packs" "$FFWIKI_OBJECTS_URL" "$R2_BUCKET" "${FFWIKI_BUILDS:-}" "$(node --version)" |
            sha256sum | cut -d ' ' -f 1)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore prepared 3D preview data
        id: preview-cache
        if: env.FFWIKI_OBJECTS_URL != ''
        uses: actions/cache/restore@v4
        with:
          path: |
            site/public/data/*/previews/**/*.json
            .cache/objects/publication.json
          key: previews-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.objects-inputs.outputs.key }}-${{ hashFiles('build/src/**/*.ts', 'build/src/**/*.json', 'build/tsconfig.json', 'shared/**/*.ts', 'shared/**/*.json', 'fixed_data/**/*.json', 'package-lock.json') }}

      - name: Compile data build tools
        run: npm run build -w build

      - name: Verify cached 3D assets in R2
        id: cached-publication
        if: steps.preview-cache.outputs.cache-hit == 'true'
        run: node build/dist/objects/upload.js --verify-cached
        env:
          FFWIKI_RELEASE: ${{ steps.ffinfo.outputs.tag }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}

      - name: Build pipeline (download + normalize)
        run: node build/dist/index.js
        env:
          FFWIKI_RELEASE: ${{ steps.ffinfo.outputs.tag }}
          FFWIKI_REUSE_PREVIEWS: ${{ steps.cached-publication.outputs.verified }}

      - name: Build site (Vite + MDX)
        run: npm run build:site

      - name: Smoke checks
        run: |
          # Cloudflare Pages: ≤20,000 files per deployment, ≤25 MB per file.
          FILE_COUNT=$(find site/dist -type f | wc -l)
          echo "site/dist file count: $FILE_COUNT"
          if [ "$FILE_COUNT" -gt 20000 ]; then
            echo "::error::site/dist exceeds Cloudflare Pages' 20,000 file limit ($FILE_COUNT)"
            exit 1
          fi
          OVERSIZE=$(find site/dist -type f -size +25M)
          if [ -n "$OVERSIZE" ]; then
            echo "::error::Files exceed Cloudflare Pages' 25 MB per-file limit:"
            echo "$OVERSIZE"
            exit 1
          fi

      - name: Publish or reuse shared 3D assets in R2
        id: publish-objects
        if: env.FFWIKI_OBJECTS_URL != ''
        run: |
          if [[ "$REUSE_PREVIEWS" == true ]]; then
            echo "Reusing the verified 3D assets in R2."
          else
            node build/dist/objects/upload.js
          fi
        env:
          REUSE_PREVIEWS: ${{ steps.cached-publication.outputs.verified }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_UPLOAD_CONCURRENCY: ${{ vars.R2_UPLOAD_CONCURRENCY || '48' }}

      - name: Cache published 3D preview data
        if: steps.publish-objects.outcome == 'success' && steps.preview-cache.outputs.cache-hit != 'true' && steps.preview-cache.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            site/public/data/*/previews/**/*.json
            .cache/objects/publication.json
          key: ${{ steps.preview-cache.outputs.cache-primary-key }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: pages deploy dist --project-name=openfusion-auto-wiki --branch=main

      - name: Request a ZIP release in the prose repository
        if: success() && steps.publish-objects.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.PROSE_RELEASE_TOKEN }}
          PROSE_REPOSITORY: ${{ vars.PROSE_REPOSITORY || 'FinnHornhoover/OpenFusionWikiProse' }}
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Set the Actions secret PROSE_RELEASE_TOKEN with Contents write access to $PROSE_REPOSITORY."
            exit 1
          fi
          gh api --method POST "repos/$PROSE_REPOSITORY/dispatches" \
            --raw-field event_type=publish-wiki-prose
          echo "Release requested. Follow the run at https://github.com/$PROSE_REPOSITORY/actions."
