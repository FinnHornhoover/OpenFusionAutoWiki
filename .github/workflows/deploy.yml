name: Deploy site and build MediaWiki release

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: cf-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    env:
      FFWIKI_BASE_URL: ${{ vars.FFWIKI_BASE_URL || 'https://openfusion-auto-wiki.pages.dev' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install workspace deps
        run: npm ci

      - name: Resolve latest FFInfoPacks tag
        id: ffinfo
        run: |
          TAG=$(curl -sSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/FinnHornhoover/FFInfoPacks/releases/latest \
            | jq -r '.tag_name')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::Failed to resolve latest FFInfoPacks release tag"
            exit 1
          fi
          echo "FFInfoPacks latest: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Cache FFInfoPacks ZIPs
        uses: actions/cache@v4
        with:
          path: .cache/ffinfo
          key: ffinfo-${{ steps.ffinfo.outputs.tag }}-v1

      - name: Cache icon dedup maps
        uses: actions/cache@v4
        with:
          path: .cache/iconmaps
          key: iconmaps-${{ steps.ffinfo.outputs.tag }}-v1

      - name: Build pipeline (download + normalize)
        run: npm run build:data

      - name: Build site (Vite + MDX)
        run: npm run build:site

      - name: Build MediaWiki export
        run: npm run build:mediawiki

      - name: Package MediaWiki server release
        run: |
          npm run package:mediawiki
          shopt -s nullglob
          FILES=(
            mediawiki/openfusion-autowiki-mediawiki.tar.gz
            mediawiki/openfusion-autowiki-mediawiki.tar.gz.part-*
          )
          sha256sum "${FILES[@]}" \
            > mediawiki/openfusion-autowiki-mediawiki.tar.gz.sha256

      - name: Publish MediaWiki release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FFINFO_TAG: ${{ steps.ffinfo.outputs.tag }}
        run: |
          SAFE_FFINFO_TAG=$(printf '%s' "$FFINFO_TAG" | tr -c 'A-Za-z0-9._-' '-')
          TAG="mediawiki-${SAFE_FFINFO_TAG}-${GITHUB_SHA::12}"
          shopt -s nullglob
          ASSETS=(
            mediawiki/openfusion-autowiki-mediawiki.tar.gz
            mediawiki/openfusion-autowiki-mediawiki.tar.gz.part-*
            mediawiki/openfusion-autowiki-mediawiki.tar.gz.sha256
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" "${ASSETS[@]}" \
            --title "OpenFusionAutoWiki MediaWiki ${FFINFO_TAG}" \
            --notes "Server-side MediaWiki import generated from ${GITHUB_SHA}." \
            --latest

      - name: Smoke checks
        run: |
          FILE_COUNT=$(find site/dist -type f | wc -l)
          echo "site/dist file count: $FILE_COUNT"
          if [ "$FILE_COUNT" -ge 20000 ]; then
            echo "::error::site/dist exceeds Cloudflare Pages' 20,000 file limit ($FILE_COUNT)"
            exit 1
          fi
          OVERSIZE=$(find site/dist -type f -size +25M)
          if [ -n "$OVERSIZE" ]; then
            echo "::error::Files exceed Cloudflare Pages' 25 MB per-file limit:"
            echo "$OVERSIZE"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=openfusion-auto-wiki --branch=main
