services:
  wiki:
    build:
      context: .
      dockerfile: Dockerfile
    image: ffwiki:local
    ports:
      - "8080:80"
    # Cache mount removed for now; once the build pipeline downloads ZIPs in P1,
    # mounting ./.cache to /app/.cache will avoid re-downloading on rebuild.

